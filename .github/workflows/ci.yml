name: CI - ms-productos

on:
  push:
    branches: [ "feature/**", develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar el proyecto
        run: mvn clean install -Djacoco.skip=true

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Crear .env desde el ejemplo
        run: cp .env.example .env

      - name: Construir imagenes
        run: docker compose build


  push-ghcr:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Nombre de imagen en minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}