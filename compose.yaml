services:
  mysql:
    image: mysql:8.0
    container_name: mysql-productos
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  ms-productos:
    build: .
    image: ${APP_IMAGE:-ms-productos:local}
    container_name: ms-productos
    ports:
      - "9095:9095"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9095"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  mysql_data:
  app_logs: