services:
  mysql:
    image: mysql:8.0
    container_name: mysql-productos
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: db_productos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  ms-productos:
    build: .
    container_name: ms-productos
    ports:
      - "9095:9095"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure:5

volumes:
  mysql_data: