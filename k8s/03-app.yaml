apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-productos
  namespace: app
  labels:
    app: ms-productos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-productos
  template:
    metadata:
      labels:
        app: ms-productos
    spec:
      enableServiceLinks: false
      # Espera a que MySQL acepte conexiones antes de arrancar (Flyway migra al iniciar)
      initContainers:
        - name: esperar-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo esperando mysql; sleep 2; done"]
      containers:
        - name: ms-productos
          # Imagen local cargada con: kind load docker-image ms-productos:local --name devops
          image: ms-productos:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9095
          envFrom:
            - configMapRef:
                name: ms-productos-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
          # Probes TCP por ahora. Cuando Javier agregue Actuator, cambiar a httpGet
          # sobre /actuator/health/readiness y /actuator/health/liveness.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ms-productos
  namespace: app
  labels:
    app: ms-productos
spec:
  selector:
    app: ms-productos
  ports:
    - name: http
      port: 9095
      targetPort: http
