global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alert.rules.yml
scrape_configs:
  - job_name: ms-productos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ms-productos:9095']
        labels:
          app: ms-productos

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
